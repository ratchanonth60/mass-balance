[workspace]
resolver = "2"
members = ["crates/protocol", "crates/control", "crates/io", "crates/app"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
control = { path = "crates/control" }
io = { path = "crates/io" }
nalgebra = "0.35.0"
clarabel = "0.11.1"
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.36.1"
egui_plot = "0.37.0"
anyhow = "1"
thiserror = "2"
